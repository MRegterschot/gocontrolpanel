# Coolify stack. Deploy it once per environment and set IMAGE_TAG in Coolify:
#   production -> latest (default), staging -> dev, release -> release
# Domains are assigned per service in Coolify; secrets are generated by Coolify.
# Set real HTTPS domains on both services (a sslip.io http domain breaks wss://), and register
# https://<web domain>/api/auth/callback/nadeo with Nadeo for each environment.
# SECRETS_KEY and HETZNER_KEY are generated: don't recreate the resource, or stored keys become unreadable.
services:
  tmcontrolpanel:
    image: marijnregterschot/tmcontrolpanel:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - SERVICE_URL_TMCONTROLPANEL_3000
      - NEXTAUTH_URL=${SERVICE_URL_TMCONTROLPANEL}
      - NEXTAUTH_SECRET=${SERVICE_BASE64_64_NEXTAUTH}
      - DEFAULT_ADMINS=${DEFAULT_ADMINS:-}
      - DEFAULT_PERMISSIONS=${DEFAULT_PERMISSIONS:-}
      - NADEO_CLIENT_ID=${NADEO_CLIENT_ID:?}
      - NADEO_CLIENT_SECRET=${NADEO_CLIENT_SECRET:?}
      - NADEO_REDIRECT_URI=${SERVICE_URL_TMCONTROLPANEL}/api/auth/callback/nadeo
      - NADEO_SERVER_LOGIN=${NADEO_SERVER_LOGIN:?}
      - NADEO_SERVER_PASSWORD=${NADEO_SERVER_PASSWORD:?}
      - NADEO_CONTACT=${NADEO_CONTACT:-TMControlPanel}
      - DATABASE_URL=mysql://tmcontrolpanel:${SERVICE_PASSWORD_MARIADB}@db:3306/tmcontrolpanel
      - REDIS_URI=redis://:${SERVICE_PASSWORD_REDIS}@redis:6379
      - HETZNER_KEY=${SERVICE_PASSWORD_64_HETZNER}
      - GBX_SERVICE_URL=http://gbx-service:3100
      - GBX_SERVICE_WS_URL=wss://${SERVICE_FQDN_GBX_SERVICE}
      - GBX_SERVICE_TOKEN=${SERVICE_PASSWORD_64_GBXTOKEN}
      - WS_TICKET_SECRET=${SERVICE_PASSWORD_64_WSTICKET}
      - PANEL_INTERNAL_TOKEN=${SERVICE_PASSWORD_64_PANELTOKEN}
      - SECRETS_KEY=${SERVICE_PASSWORD_64_SECRETS}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      # Healthy once the server answers, which is after the migrations have run
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # GBX connections, in-game plugins and live WebSockets; needs its own domain (browser WebSockets)
  gbx-service:
    image: marijnregterschot/tmcontrolpanel-gbx-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - SERVICE_URL_GBX_SERVICE_3100
      - DATABASE_URL=mysql://tmcontrolpanel:${SERVICE_PASSWORD_MARIADB}@db:3306/tmcontrolpanel
      - REDIS_URI=redis://:${SERVICE_PASSWORD_REDIS}@redis:6379
      - SECRETS_KEY=${SERVICE_PASSWORD_64_SECRETS}
      - GBX_SERVICE_TOKEN=${SERVICE_PASSWORD_64_GBXTOKEN}
      - WS_TICKET_SECRET=${SERVICE_PASSWORD_64_WSTICKET}
      - WS_ALLOWED_ORIGINS=${SERVICE_URL_TMCONTROLPANEL}
      - PANEL_INTERNAL_URL=http://tmcontrolpanel:3000
      - PANEL_INTERNAL_TOKEN=${SERVICE_PASSWORD_64_PANELTOKEN}
      - NADEO_SERVER_LOGIN=${NADEO_SERVER_LOGIN:?}
      - NADEO_SERVER_PASSWORD=${NADEO_SERVER_PASSWORD:?}
      - NADEO_CONTACT=${NADEO_CONTACT:-TMControlPanel}
      - NADEO_CLIENT_ID=${NADEO_CLIENT_ID:?}
      - NADEO_CLIENT_SECRET=${NADEO_CLIENT_SECRET:?}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      tmcontrolpanel:
        condition: service_healthy # Runs the database migrations

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${SERVICE_PASSWORD_MARIADBROOT}
      - MARIADB_USER=tmcontrolpanel
      - MARIADB_PASSWORD=${SERVICE_PASSWORD_MARIADB}
      - MARIADB_DATABASE=tmcontrolpanel
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  redis-data:
