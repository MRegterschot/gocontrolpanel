services:
  dedicated:
    image: evoesports/trackmania:latest
    restart: unless-stopped
    ports:
      - 2350:2350/udp
      - 2350:2350/tcp
    environment:
      TM_MASTERSERVER_LOGIN: 
      TM_MASTERSERVER_PASSWORD: 
      TM_SYSTEM_XMLRPC_ALLOWREMOTE: True
    volumes:
      - user-data:/server/UserData

  db:
    image: mysql:latest
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password_whatever
      MYSQL_USER: maniacontrol
      MYSQL_PASSWORD: MCWithTMCP123
      MYSQL_DATABASE: maniacontrol
    volumes:
      - db-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d

  maniacontrol:
    image: amzgbeu/trackmaniacontrol:latest
    restart: unless-stopped
    environment:
      SERVER: dedicated
      MYSQL_HOST: db
      MYSQL_DATABASE: maniacontrol
      MYSQL_USER: maniacontrol
      MYSQL_PASSWORD: MCWithTMCP123
      MASTERADMINS:
    volumes:
      - user-data:/server/UserData
    depends_on:
      - dedicated
      - db
  
  tmcontrolpanel:
    image: marijnregterschot/tmcontrolpanel:beta # Use marijnregterschot/tmcontrolpanel-postgres:beta if you are using PostgreSQL
    ports:
      - 3000:3000
    restart: unless-stopped
    environment:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: 
      DEFAULT_ADMINS: 
      DEFAULT_PERMISSIONS: 
      NADEO_CLIENT_ID: 
      NADEO_CLIENT_SECRET: 
      NADEO_REDIRECT_URI: http://localhost:3000/api/auth/callback/nadeo
      NADEO_SERVER_LOGIN: 
      NADEO_SERVER_PASSWORD: 
      NADEO_CONTACT: TMControlPanel / <your contact info>
      REDIS_URI: redis://redis:6379
      DATABASE_URL: mysql://tmcontrolpanel:VettePanel123@db:3306/tmcontrolpanel
      HETZNER_KEY: 
      GBX_SERVICE_URL: http://gbx-service:3100
      GBX_SERVICE_WS_URL: ws://localhost:3100 # Must be reachable from the browser
      GBX_SERVICE_TOKEN: # Same value as the GBX service, at least 32 characters
      WS_TICKET_SECRET: # Same value as the GBX service, at least 32 characters
      LOG_LEVEL: info
    depends_on:
      - db
      - redis

  # GBX connections, in-game plugins and live WebSockets
  gbx-service:
    image: marijnregterschot/tmcontrolpanel-gbx-service:beta # Use marijnregterschot/tmcontrolpanel-gbx-service-postgres:beta if you are using PostgreSQL
    ports:
      - 3100:3100 # WebSockets for the browser; /internal routes require GBX_SERVICE_TOKEN
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://tmcontrolpanel:VettePanel123@db:3306/tmcontrolpanel
      REDIS_URI: redis://redis:6379
      GBX_SERVICE_TOKEN: # Same value as the web app, at least 32 characters
      WS_TICKET_SECRET: # Same value as the web app, at least 32 characters
      WS_ALLOWED_ORIGINS: http://localhost:3000
      NADEO_SERVER_LOGIN: 
      NADEO_SERVER_PASSWORD: 
      NADEO_CONTACT: TMControlPanel / <your contact info>
      NADEO_CLIENT_ID: 
      NADEO_CLIENT_SECRET: 
      LOG_LEVEL: info
    depends_on:
      - db
      - redis
      - tmcontrolpanel # Runs the database migrations

  filemanager:
    image: marijnregterschot/trackmania-server-fm:latest
    restart: unless-stopped
    volumes:
      - user-data:/app/UserData

  redis:
    image: redis:latest
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  user-data:
  db-data:
  redis-data: