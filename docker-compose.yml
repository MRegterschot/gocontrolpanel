services:
  gocontrolpanel:
    image: marijnregterschot/gocontrolpanel:beta # Use marijnregterschot/gocontrolpanel-postgres:beta if you are using PostgreSQL
    ports:
      - 3000:3000
    restart: unless-stopped
    environment:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: 
      DEFAULT_ADMINS: 
      DEFAULT_PERMISSIONS: 
      NADEO_CLIENT_ID: 
      NADEO_CLIENT_SECRET: 
      NADEO_REDIRECT_URI: http://localhost:3000/api/auth/callback/nadeo
      NADEO_SERVER_LOGIN: 
      NADEO_SERVER_PASSWORD: 
      NADEO_CONTACT: GoControlPanel / <your contact info>
      DATABASE_URL: mysql://gocontrolpanel:VettePanel123@db:3306/gocontrolpanel
      REDIS_URI: redis://redis:6379
      HETZNER_KEY: 
      LOG_LEVEL: info
    depends_on:
      - db
      - redis

  # Enable once the web app talks to it (phase 4 in docs/refactor-plan.md); until then both
  # would connect to the same dedicated servers.
  # # GBX connections, in-game plugins and live WebSockets (see docs/refactor-plan.md)
  # gbx-service:
  #   image: marijnregterschot/gocontrolpanel-gbx-service:beta # Use marijnregterschot/gocontrolpanel-gbx-service-postgres:beta if you are using PostgreSQL
  #   ports:
  #     - 3100:3100 # WebSockets for the browser; /internal routes require GBX_SERVICE_TOKEN
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: mysql://gocontrolpanel:VettePanel123@db:3306/gocontrolpanel
  #     REDIS_URI: redis://redis:6379
  #     GBX_SERVICE_TOKEN: # Same value as the web app, at least 32 characters
  #     WS_TICKET_SECRET: # Same value as the web app, at least 32 characters
  #     WS_ALLOWED_ORIGINS: http://localhost:3000
  #     NADEO_SERVER_LOGIN: 
  #     NADEO_SERVER_PASSWORD: 
  #     NADEO_CONTACT: GoControlPanel / <your contact info>
  #     NADEO_CLIENT_ID: 
  #     NADEO_CLIENT_SECRET: 
  #     LOG_LEVEL: info
  #   depends_on:
  #     - db
  #     - redis
  #     - gocontrolpanel # Runs the database migrations

  dedicated:
    image: evoesports/trackmania:latest
    restart: unless-stopped
    ports:
      - 2350:2350/udp
      - 2350:2350/tcp
    environment:
      TM_MASTERSERVER_LOGIN: 
      TM_MASTERSERVER_PASSWORD: 
      TM_SYSTEM_XMLRPC_ALLOWREMOTE: True
    volumes:
      - user-data:/server/UserData

  filemanager:
    image: marijnregterschot/trackmania-server-fm:latest
    restart: unless-stopped
    volumes:
      - user-data:/app/UserData

  db:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: password_whatever
      MARIADB_USER: gocontrolpanel
      MARIADB_PASSWORD: VettePanel123
      MARIADB_DATABASE: gocontrolpanel
    volumes:
      - db-data:/var/lib/mysql

  redis:
    image: redis:latest
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  db-data:
  redis-data:
  user-data:
