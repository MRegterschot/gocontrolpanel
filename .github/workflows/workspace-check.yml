name: Workspace Check

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [mysql, postgres]

    env:
      DB: ${{ matrix.db }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client for ${{ matrix.db }}
        run: bun run generate

      - name: Typecheck shared packages and GBX service
        run: |
          bun run --filter @gcp/shared typecheck
          bun run --filter @gcp/gbx-service typecheck

      - name: Unit tests
        run: |
          bun run --filter @gcp/shared test
          bun run --filter @gcp/gbx-service test

      - name: Build GBX service
        run: bun run --filter @gcp/gbx-service build

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gcp
          POSTGRES_PASSWORD: gcp
          POSTGRES_DB: gcp_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U gcp" --health-interval 2s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DB: postgres
      DATABASE_URL: postgresql://gcp:gcp@localhost:5432/gcp_test
      INTEGRATION_DATABASE_URL: postgresql://gcp:gcp@localhost:5432/gcp_test
      INTEGRATION_REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Apply migrations
        run: bun run deploy

      - name: Integration tests
        run: bun run --filter @gcp/gbx-service test:integration
