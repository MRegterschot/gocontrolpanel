name: Publish Branch Image

on:
  push:
    branches: ["**"]

concurrency:
  group: docker-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db:
          - name: mysql
            suffix: ""
          - name: postgres
            suffix: -postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Resolve image tag
        run: |
          # Sanitized branch name; latest/beta stay reserved for the release workflow
          TAG=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.-]/-/g' | cut -c1-128)
          case "$TAG" in latest|beta) TAG="branch-$TAG" ;; esac
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      - name: Build and push images
        run: |
          GBX_IMAGE_NAME=${{ vars.DOCKER_GBX_IMAGE_NAME || 'tmcontrolpanel-gbx-service' }}
          WEB_IMAGE_NAME=${{ vars.DOCKER_WEB_IMAGE_NAME || 'tmcontrolpanel' }}

          # <dockerfile>=<image name>
          for target in \
            "apps/web/Dockerfile=$WEB_IMAGE_NAME" \
            "apps/gbx-service/Dockerfile=$GBX_IMAGE_NAME"; do
            DOCKERFILE=${target%%=*}
            IMAGE=${{ secrets.DOCKER_USERNAME }}/${target#*=}${{ matrix.db.suffix }}

            docker build -f $DOCKERFILE -t $IMAGE:$IMAGE_TAG . --build-arg DB_TYPE=${{ matrix.db.name }}
            docker push $IMAGE:$IMAGE_TAG
          done
