name: Publish Release Image

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db:
          - name: mysql
            suffix: ""
          - name: postgres
            suffix: -postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract release info
        id: release_info
        run: |
          echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          echo "IS_PRERELEASE=${{ github.event.release.prerelease }}" >> $GITHUB_ENV

      - name: Build and tag images
        run: |
          GBX_IMAGE_NAME=${{ vars.DOCKER_GBX_IMAGE_NAME || 'tmcontrolpanel-gbx-service' }}

          # <dockerfile>=<image name>
          for target in \
            "apps/web/Dockerfile=${{ vars.DOCKER_IMAGE_NAME || 'tmcontrolpanel' }}" \
            "apps/gbx-service/Dockerfile=$GBX_IMAGE_NAME"; do
            DOCKERFILE=${target%%=*}
            IMAGE=${{ secrets.DOCKER_USERNAME }}/${target#*=}${{ matrix.db.suffix }}

            docker build -f $DOCKERFILE -t $IMAGE:${{ env.RELEASE_TAG }} . --build-arg DB_TYPE=${{ matrix.db.name }}

            if [ "${{ env.IS_PRERELEASE }}" = "true" ]; then
              docker tag $IMAGE:${{ env.RELEASE_TAG }} $IMAGE:beta
              docker push $IMAGE:beta
            else
              docker tag $IMAGE:${{ env.RELEASE_TAG }} $IMAGE:latest
              docker push $IMAGE:latest
            fi

            docker push $IMAGE:${{ env.RELEASE_TAG }}
          done

  send-discord:
    needs: build-and-push
    uses: ./.github/workflows/discord-changelog.yml
    secrets: inherit

  deploy:
    needs: build-and-push
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit
