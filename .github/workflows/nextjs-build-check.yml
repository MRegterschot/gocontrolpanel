name: CI

on:
  pull_request:

jobs:
  quality:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    # The generated Prisma client is required for typechecking. The two schemas
    # produce the same TypeScript surface for everything the type checker sees,
    # so one flavour is enough here; the build job below covers both.
    env:
      DB: mysql

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: ROLES.md is up to date with the permission constants
        run: |
          bun run generate:roles
          git diff --exit-code ROLES.md

  build:
    name: Build (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [mysql, postgres]

    env:
      DB: ${{ matrix.db }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client for ${{ matrix.db }}
        run: bun run generate

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ matrix.db }}-${{ runner.os }}-${{ hashFiles('**/*.[jt]s', '**/*.json', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ matrix.db }}-${{ runner.os }}-

      - name: Build project for ${{ matrix.db }}
        run: bun run build
