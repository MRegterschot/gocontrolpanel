name: NextJS Build Check

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [mysql, postgres]

    env:
      DB: ${{ matrix.db }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client for ${{ matrix.db }}
        run: bun run generate

      - name: Cache Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ matrix.db }}-${{ runner.os }}-${{ hashFiles('**/*.[jt]s', '**/*.json', 'next.config.js') }}
          restore-keys: |
            nextjs-${{ matrix.db }}-${{ runner.os }}-

      - name: Build web for ${{ matrix.db }}
        run: bun run --filter @gcp/web build
