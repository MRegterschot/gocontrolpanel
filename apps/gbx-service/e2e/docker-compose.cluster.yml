services:
  dedicated-2:
    image: evoesports/trackmania:latest
    restart: unless-stopped
    command: ["./TrackmaniaServer", "/lan"]
    ports:
      - "${E2E_GAME_PORT_2:-2351}:2350/udp"
      - "${E2E_GAME_PORT_2:-2351}:2350/tcp"
      - "${E2E_GBX_PORT_2:-5011}:5000/tcp"
    environment:
      TM_MASTERSERVER_LOGIN: ${TM_MASTERSERVER_LOGIN:?Set TM_MASTERSERVER_LOGIN in e2e/.env}
      TM_MASTERSERVER_PASSWORD: ${TM_MASTERSERVER_PASSWORD:?Set TM_MASTERSERVER_PASSWORD in e2e/.env}
      TM_SYSTEM_XMLRPC_ALLOWREMOTE: "True"
      TM_AUTHORIZATION_SUPERADMIN_PASSWORD: ${E2E_GBX_PASSWORD:-SuperAdmin}
      TM_SERVER_NAME: TMCP e2e 2
    volumes:
      - userdata-2:/server/UserData

  dedicated-3:
    image: evoesports/trackmania:latest
    restart: unless-stopped
    command: ["./TrackmaniaServer", "/lan"]
    ports:
      - "${E2E_GAME_PORT_3:-2352}:2350/udp"
      - "${E2E_GAME_PORT_3:-2352}:2350/tcp"
      - "${E2E_GBX_PORT_3:-5012}:5000/tcp"
    environment:
      TM_MASTERSERVER_LOGIN: ${TM_MASTERSERVER_LOGIN:?Set TM_MASTERSERVER_LOGIN in e2e/.env}
      TM_MASTERSERVER_PASSWORD: ${TM_MASTERSERVER_PASSWORD:?Set TM_MASTERSERVER_PASSWORD in e2e/.env}
      TM_SYSTEM_XMLRPC_ALLOWREMOTE: "True"
      TM_AUTHORIZATION_SUPERADMIN_PASSWORD: ${E2E_GBX_PASSWORD:-SuperAdmin}
      TM_SERVER_NAME: TMCP e2e 3
    volumes:
      - userdata-3:/server/UserData

volumes:
  userdata-2:
  userdata-3:
