name: Publish marketplace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: MRegterschot/gocontrolpanel
          ref: ${{ vars.GOCONTROLPANEL_REF || 'master' }}
          path: .gocontrolpanel

      - uses: oven-sh/setup-bun@v2

      - name: Install the plugin SDK
        working-directory: .gocontrolpanel
        run: bun install --frozen-lockfile

      # index.json plus a copy of every package, README and icon
      - name: Build the site
        working-directory: .gocontrolpanel
        run: bun packages/plugin-sdk/src/cli/main.ts registry --registry "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/_site"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
